[project]
name = "invoice-auditor"
version = "0.1.0"
description = "Invoice Auditor — proactive cross-brand invoice anomaly detection (AI app + agent)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# add when implementing real serving/training: vllm, peft, mlflow, scikit-learn, snowflake-connector

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["libs*", "services*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
