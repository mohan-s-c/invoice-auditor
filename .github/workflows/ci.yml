name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

      - name: Check UI JS syntax
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('services/dashboard_api/static/index.html', 'utf-8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)]
            .map(m => m[1]).filter(js => !js.includes('src='));
          fs.writeFileSync('/tmp/ui.js', scripts.join('\n'));
          "
          node --check /tmp/ui.js
